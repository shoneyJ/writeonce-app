<div *ngIf="project">
    <h1>{{ project.name }}</h1>
    <p>{{ project.description }}</p>
    <a [href]="project.web_url" target="_blank">View on GitLab</a>
  </div>
  
  <div *ngIf="repositoryTree">
    <h2>Repository Files:</h2>
    <ul>
      <li *ngFor="let file of repositoryTree">
        {{ file.name }} (Type: {{ file.type }})
      </li>
    </ul>
  </div>
