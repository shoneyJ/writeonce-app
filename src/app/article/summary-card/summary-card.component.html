    <div class="max-w-3xl text-left mx-auto my-4 p-4 border-b border-gray-300">
        <a [routerLink]="router" class="text-blue-600 hover:underline text-lg font-semibold">
            {{ title }}
        </a>
        <p class="text-gray-700 text-sm mt-1">
            {{ introduction }}
        </p>
        <div class="flex space-x-2 mt-2">
            <span 
                *ngFor="let tag of tags" 
                class="bg-gray-200 text-gray-700 text-xs px-2 py-1 rounded">
                {{ tag }}
            </span>
        </div>
        
    </div>
