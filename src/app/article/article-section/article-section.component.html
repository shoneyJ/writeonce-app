<section class="article-section max-w-2xl mx-auto mb-4  ">
    <h1 class="text-3xl font-bold mb-4">{{heading}}</h1>

    <ng-container *ngFor="let paragraph of paragraphs;let i = index ">

        <p class="text-left text-gray-700 mb-4">{{ paragraph }}</p>
        <ng-container #dynamicCodeSnippetComponent></ng-container>
        <ng-container #dynamicImageComponent></ng-container>
    </ng-container>



</section>
