<ul class="list-disc pl-5">
    <li *ngFor="let reference of references">
      <a [href]="reference.url" target="_blank" class="text-blue-600 hover:underline">{{ reference.title }}</a> 
      <span class="text-gray-500">(Accessed on {{ reference.accessedOnDate | date:'fullDate' }})</span>
    </li>
  </ul>
