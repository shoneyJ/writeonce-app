server {
    listen 443 default_server ssl;
    listen [::]:443 ssl;

    server_name writeonce.de www.writeonce.de;

     server_tokens off;

    ssl_certificate /etc/nginx/ssl/live/writeonce.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/writeonce.de/privkey.pem;

     ssl_buffer_size 8k;

        ssl_dhparam /etc/ssl/certs/dhparam-2048.pem;

        ssl_protocols TLSv1.2;
        ssl_prefer_server_ciphers on;

        ssl_ciphers ECDH+AESGCM:ECDH+AES256:ECDH+AES128:DH+3DES:!ADH:!AECDH:!MD5;

        ssl_ecdh_curve secp384r1;
        ssl_session_tickets off;

        ssl_stapling on;
        ssl_stapling_verify on;

        resolver 8.8.8.8;

          location / {
    	try_files $uri $uri/ /index.html;
    }

         location /api/ {
            proxy_pass http://writeonce-api-container:8085/api/;
            proxy_set_header X-Forwarded-For $remote_addr;
  
  }
    
  

    root /usr/share/nginx/html;
        index index.html index.htm;
}